name: Build sys-clk artifacts - 20251118

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update system packages
        run: |
          sudo apt-get update || true
          sudo apt-get upgrade -y git build-essential
        shell: bash

      - name: Install latest libnx
        run: |
          git config --global --add safe.directory "*"
          git clone --recurse-submodules https://github.com/switchbrew/libnx.git
          cd libnx
          make install -j$(nproc)
        shell: bash

      - name: Set environment variables
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITA64=/opt/devkitpro/devkitA64" >> $GITHUB_ENV

      - name: Build overlay
        run: |
          git config --global --add safe.directory `pwd`
          cd overlay
          make -j$(nproc)
          cd ..
        shell: bash

      - name: Build sysmodule
        run: |
          cd sysmodule
          make libs -j$(nproc)
          make -j$(nproc)
          cd ..
        shell: bash

      - name: Build manager (sys-clk-manager.nro)
        run: |
          cd manager
          make -j$(nproc)
          cd ..
        shell: bash

      - name: Package language files
        run: |
          zip -r lang.zip overlay/lang/*
        shell: bash

      - name: Get version from overlay/Makefile
        run: |
          RAW_VERSION=$(awk '/^APP_VERSION[[:space:]]*:=/ {
            gsub(/^APP_VERSION[[:space:]]*:=/, "");
            gsub(/[[:space:]]+$/, "");
            print $0
          }' overlay/Makefile)
          echo "TAG=$RAW_VERSION" >> $GITHUB_ENV

      - name: Prepare sys-clk.zip
        run: |
          mkdir -p atmosphere/contents/00FF0000636C6BFF/flags config/sys-clk switch/.overlays/ switch/sys-clk/
          cp sysmodule/out/sys-clk.nsp atmosphere/contents/00FF0000636C6BFF/exefs.nsp
          cp sysmodule/toolbox.json atmosphere/contents/00FF0000636C6BFF/toolbox.json
          touch atmosphere/contents/00FF0000636C6BFF/flags/boot2.flag
          cp overlay/out/sys-clk-overlay.ovl switch/.overlays/
          cp -r overlay/lang config/sys-clk/
          cp config.ini.template config/sys-clk/config.ini.template
          cp manager/sys-clk-manager.nro switch/sys-clk/
          zip -r sys-clk.zip atmosphere/ config/ switch/
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sys-clk-${{ env.TAG }}
          path: |
            sys-clk.zip
            lang.zip
            overlay/out/sys-clk-overlay.ovl
            manager/sys-clk-manager.nro

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            sys-clk.zip
            lang.zip
            overlay/out/sys-clk-overlay.ovl
            manager/sys-clk-manager.nro
          tag_name: ${{ env.TAG }}
          name: sys-clk ${{ env.TAG }}
          body: "sys-clk ${{ env.TAG }} 多语言版 支持EOS\n\n- sys-clk.zip：完整SD卡结构包（直接解压到SD卡根目录）\n- lang.zip：独立语言包\n- sys-clk-overlay.ovl：单独覆盖层文件\n- sys-clk-manager.nro：单独管理器应用"
          generate_release_notes: true
